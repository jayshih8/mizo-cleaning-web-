              const item = { ...(parent[itemKey] || {}) };
              const existingImages = Array.isArray(item.images) && item.images.length > 0
                ? [...item.images.filter(Boolean)]
                : (item.image ? [item.image] : []);
              const selected = existingImages.splice(imageIndex, 1)[0];
              if (!selected) return previous;
              const nextImages = [selected, ...existingImages];
              parent[itemKey] = {
                ...item,
                images: nextImages,
                image: nextImages[0],
              };
              return nextData;
            });
            showToast('已設為此項目的封面圖片。');
          };

