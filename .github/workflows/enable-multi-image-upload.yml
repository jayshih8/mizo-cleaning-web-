name: 啟用多圖批次上傳

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/enable-multi-image-upload.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 套用多圖上傳與前台相簿功能
        shell: bash
        run: |
          cat > /tmp/enable_multi_image.py <<'PY'
          from pathlib import Path

          ROOT = Path.cwd()

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: 預期找到 1 處，實際找到 {count} 處')
              return text.replace(old, new, 1)

          image_gallery = r'''import React, { useEffect, useMemo, useState } from 'react';
          import { createPortal } from 'react-dom';
          import { ChevronLeft, ChevronRight, Images, X } from 'lucide-react';

          const DEFAULT_FALLBACK = 'images/banner_building.png';

          export default function ImageGallery({
            images,
            fallback = DEFAULT_FALLBACK,
            alt = '施工現場照片',
            variant = 'carousel',
            style = {},
            imageStyle = {},
          }) {
            const normalizedImages = useMemo(() => {
              const list = Array.isArray(images)
                ? images.filter((image) => typeof image === 'string' && image.trim())
                : [];
              if (list.length > 0) return list;
              return [fallback || DEFAULT_FALLBACK];
            }, [images, fallback]);

            const [activeIndex, setActiveIndex] = useState(0);
            const [lightboxIndex, setLightboxIndex] = useState(null);

            useEffect(() => {
              setActiveIndex((current) => Math.min(current, normalizedImages.length - 1));
              setLightboxIndex((current) => (
                current === null ? null : Math.min(current, normalizedImages.length - 1)
              ));
            }, [normalizedImages.length]);

            useEffect(() => {
              if (lightboxIndex === null) return undefined;

              const handleKeyDown = (event) => {
                if (event.key === 'Escape') setLightboxIndex(null);
                if (event.key === 'ArrowLeft') {
                  setLightboxIndex((current) => (
                    current === null ? null : (current - 1 + normalizedImages.length) % normalizedImages.length
                  ));
                }
                if (event.key === 'ArrowRight') {
                  setLightboxIndex((current) => (
                    current === null ? null : (current + 1) % normalizedImages.length
                  ));
                }
              };

              document.addEventListener('keydown', handleKeyDown);
              return () => document.removeEventListener('keydown', handleKeyDown);
            }, [lightboxIndex, normalizedImages.length]);

            const applyFallback = (event) => {
              const image = event.currentTarget;
              if (image.dataset.fallbackApplied === 'true') return;
              image.dataset.fallbackApplied = 'true';
              image.src = fallback || DEFAULT_FALLBACK;
            };

            const previous = (setter) => {
              setter((current) => (
                current === null
                  ? null
                  : (current - 1 + normalizedImages.length) % normalizedImages.length
              ));
            };

            const next = (setter) => {
              setter((current) => (
                current === null ? null : (current + 1) % normalizedImages.length
              ));
            };

            const lightbox = lightboxIndex !== null && typeof document !== 'undefined'
              ? createPortal(
                <div
                  role="dialog"
                  aria-modal="true"
                  aria-label={`${alt} 圖片預覽`}
                  onClick={() => setLightboxIndex(null)}
                  style={{
                    position: 'fixed',
                    inset: 0,
                    zIndex: 10000,
                    background: 'rgba(2, 6, 23, 0.92)',
                    display: 'flex',
                    alignItems: 'center',
                    justifyContent: 'center',
                    padding: '1.25rem',
                  }}
                >
                  <button
                    type="button"
                    aria-label="關閉圖片預覽"
                    onClick={() => setLightboxIndex(null)}
                    style={{
                      position: 'fixed',
                      top: '1rem',
                      right: '1rem',
                      width: '44px',
                      height: '44px',
                      borderRadius: '999px',
                      border: '1px solid rgba(255,255,255,0.25)',
                      background: 'rgba(15, 23, 42, 0.72)',
                      color: '#fff',
                      display: 'grid',
                      placeItems: 'center',
                      cursor: 'pointer',
                      zIndex: 2,
                    }}
                  >
                    <X size={22} />
                  </button>

                  {normalizedImages.length > 1 && (
                    <button
                      type="button"
                      aria-label="上一張圖片"
                      onClick={(event) => {
                        event.stopPropagation();
                        previous(setLightboxIndex);
                      }}
                      style={{
                        position: 'fixed',
                        left: '1rem',
                        top: '50%',
                        transform: 'translateY(-50%)',
                        width: '48px',
                        height: '48px',
                        borderRadius: '999px',
                        border: '1px solid rgba(255,255,255,0.25)',
                        background: 'rgba(15, 23, 42, 0.72)',
                        color: '#fff',
                        display: 'grid',
                        placeItems: 'center',
                        cursor: 'pointer',
                        zIndex: 2,
                      }}
                    >
                      <ChevronLeft size={26} />
                    </button>
                  )}

                  <img
                    src={normalizedImages[lightboxIndex]}
                    alt={`${alt} ${lightboxIndex + 1}`}
                    onClick={(event) => event.stopPropagation()}
                    onError={applyFallback}
                    style={{
                      maxWidth: '92vw',
                      maxHeight: '86vh',
                      objectFit: 'contain',
                      borderRadius: '0.75rem',
                      boxShadow: '0 24px 80px rgba(0,0,0,0.45)',
                    }}
                  />

                  {normalizedImages.length > 1 && (
                    <button
                      type="button"
                      aria-label="下一張圖片"
                      onClick={(event) => {
                        event.stopPropagation();
                        next(setLightboxIndex);
                      }}
                      style={{
                        position: 'fixed',
                        right: '1rem',
                        top: '50%',
                        transform: 'translateY(-50%)',
                        width: '48px',
                        height: '48px',
                        borderRadius: '999px',
                        border: '1px solid rgba(255,255,255,0.25)',
                        background: 'rgba(15, 23, 42, 0.72)',
                        color: '#fff',
                        display: 'grid',
                        placeItems: 'center',
                        cursor: 'pointer',
                        zIndex: 2,
                      }}
                    >
                      <ChevronRight size={26} />
                    </button>
                  )}

                  <div style={{
                    position: 'fixed',
                    left: '50%',
                    bottom: '1rem',
                    transform: 'translateX(-50%)',
                    color: '#fff',
                    background: 'rgba(15, 23, 42, 0.72)',
                    border: '1px solid rgba(255,255,255,0.2)',
                    borderRadius: '999px',
                    padding: '0.4rem 0.8rem',
                    fontSize: '0.8rem',
                    fontWeight: 700,
                  }}>
                    {lightboxIndex + 1} / {normalizedImages.length}
                  </div>
                </div>,
                document.body,
              )
              : null;

            if (variant === 'grid') {
              const columns = normalizedImages.length === 1
                ? 1
                : normalizedImages.length === 4
                  ? 2
                  : Math.min(3, normalizedImages.length);

              return (
                <>
                  <div style={{
                    display: 'grid',
                    gridTemplateColumns: `repeat(${columns}, minmax(0, 1fr))`,
                    gap: '0.6rem',
                    width: '100%',
                    alignContent: 'stretch',
                    ...style,
                  }}>
                    {normalizedImages.map((image, index) => (
                      <button
                        key={`${image.slice(0, 48)}-${index}`}
                        type="button"
                        aria-label={`放大查看 ${alt} ${index + 1}`}
                        onClick={() => setLightboxIndex(index)}
                        style={{
                          position: 'relative',
                          border: 0,
                          padding: 0,
                          minWidth: 0,
                          overflow: 'hidden',
                          borderRadius: '0.75rem',
                          background: '#dbe4ee',
                          cursor: 'zoom-in',
                          aspectRatio: normalizedImages.length === 1 ? '16 / 9' : '4 / 3',
                          boxShadow: '0 2px 8px rgba(15, 23, 42, 0.08)',
                        }}
                      >
                        <img
                          src={image}
                          alt={`${alt} ${index + 1}`}
                          onError={applyFallback}
                          style={{
                            width: '100%',
                            height: '100%',
                            objectFit: 'cover',
                            display: 'block',
                            ...imageStyle,
                          }}
                        />
                      </button>
                    ))}
                  </div>
                  {lightbox}
                </>
              );
            }

            return (
              <>
                <div style={{
                  position: 'relative',
                  width: '100%',
                  height: '100%',
                  minHeight: '200px',
                  overflow: 'hidden',
                  background: '#dbe4ee',
                  ...style,
                }}>
                  <img
                    src={normalizedImages[activeIndex]}
                    alt={`${alt} ${activeIndex + 1}`}
                    onClick={() => setLightboxIndex(activeIndex)}
                    onError={applyFallback}
                    style={{
                      width: '100%',
                      height: '100%',
                      objectFit: 'cover',
                      display: 'block',
                      cursor: 'zoom-in',
                      ...imageStyle,
                    }}
                  />

                  {normalizedImages.length > 1 && (
                    <>
                      <button
                        type="button"
                        aria-label="上一張圖片"
                        onClick={(event) => {
                          event.stopPropagation();
                          previous(setActiveIndex);
                        }}
                        style={{
                          position: 'absolute',
                          left: '0.55rem',
                          top: '50%',
                          transform: 'translateY(-50%)',
                          width: '34px',
                          height: '34px',
                          borderRadius: '999px',
                          border: '1px solid rgba(255,255,255,0.55)',
                          background: 'rgba(15, 23, 42, 0.64)',
                          color: '#fff',
                          display: 'grid',
                          placeItems: 'center',
                          cursor: 'pointer',
                          zIndex: 4,
                        }}
                      >
                        <ChevronLeft size={19} />
                      </button>
                      <button
                        type="button"
                        aria-label="下一張圖片"
                        onClick={(event) => {
                          event.stopPropagation();
                          next(setActiveIndex);
                        }}
                        style={{
                          position: 'absolute',
                          right: '0.55rem',
                          top: '50%',
                          transform: 'translateY(-50%)',
                          width: '34px',
                          height: '34px',
                          borderRadius: '999px',
                          border: '1px solid rgba(255,255,255,0.55)',
                          background: 'rgba(15, 23, 42, 0.64)',
                          color: '#fff',
                          display: 'grid',
                          placeItems: 'center',
                          cursor: 'pointer',
                          zIndex: 4,
                        }}
                      >
                        <ChevronRight size={19} />
                      </button>
                      <span style={{
                        position: 'absolute',
                        top: '0.6rem',
                        right: '0.6rem',
                        zIndex: 4,
                        display: 'inline-flex',
                        alignItems: 'center',
                        gap: '0.3rem',
                        padding: '0.3rem 0.55rem',
                        borderRadius: '999px',
                        background: 'rgba(15, 23, 42, 0.68)',
                        color: '#fff',
                        fontSize: '0.72rem',
                        fontWeight: 700,
                        pointerEvents: 'none',
                      }}>
                        <Images size={13} />
                        {activeIndex + 1}/{normalizedImages.length}
                      </span>
                    </>
                  )}
                </div>
                {lightbox}
              </>
            );
          }
          '''

          multi_uploader = r'''import React, { useRef, useState } from 'react';
          import { Images, Plus, Star, Trash2 } from 'lucide-react';

          export default function MultiImageUploader({
            inputId,
            images = [],
            onFilesSelected,
            onRemove,
            onSetCover,
            maxImages = 30,
            hint = '點擊或拖曳，可一次選擇多張圖片',
          }) {
            const inputRef = useRef(null);
            const [dragActive, setDragActive] = useState(false);
            const safeImages = Array.isArray(images)
              ? images.filter((image) => typeof image === 'string' && image.trim())
              : [];
            const isFull = safeImages.length >= maxImages;

            const openPicker = () => {
              if (!isFull) inputRef.current?.click();
            };

            const submitFiles = (fileList) => {
              if (!fileList || fileList.length === 0 || isFull) return;
              onFilesSelected?.(fileList);
            };

            return (
              <div>
                <div
                  className="image-upload-zone"
                  role="button"
                  tabIndex={0}
                  aria-label={hint}
                  onClick={openPicker}
                  onKeyDown={(event) => {
                    if (event.key === 'Enter' || event.key === ' ') {
                      event.preventDefault();
                      openPicker();
                    }
                  }}
                  onDragEnter={(event) => {
                    event.preventDefault();
                    if (!isFull) setDragActive(true);
                  }}
                  onDragOver={(event) => event.preventDefault()}
                  onDragLeave={(event) => {
                    event.preventDefault();
                    setDragActive(false);
                  }}
                  onDrop={(event) => {
                    event.preventDefault();
                    setDragActive(false);
                    submitFiles(event.dataTransfer.files);
                  }}
                  style={{
                    cursor: isFull ? 'not-allowed' : 'pointer',
                    borderColor: dragActive ? 'var(--secondary-color)' : undefined,
                    background: dragActive ? 'rgba(13, 148, 136, 0.06)' : undefined,
                    opacity: isFull ? 0.72 : 1,
                  }}
                >
                  <Images size={26} style={{ color: 'var(--secondary-color)' }} />
                  <span>{isFull ? `此項目已達 ${maxImages} 張上限` : hint}</span>
                  <small style={{ color: 'var(--text-muted)' }}>
                    已上傳 {safeImages.length} / {maxImages} 張；支援一次選擇 6 張以上，單張建議 20MB 以下
                  </small>
                  {!isFull && (
                    <span style={{
                      display: 'inline-flex',
                      alignItems: 'center',
                      gap: '0.35rem',
                      color: 'var(--secondary-color)',
                      fontSize: '0.8rem',
                      fontWeight: 700,
                    }}>
                      <Plus size={15} />
                      選擇多張圖片
                    </span>
                  )}
                  <input
                    ref={inputRef}
                    type="file"
                    id={inputId}
                    style={{ display: 'none' }}
                    accept="image/*"
                    multiple
                    onChange={(event) => {
                      submitFiles(event.target.files);
                      event.target.value = '';
                    }}
                  />
                </div>

                {safeImages.length > 0 && (
                  <div style={{
                    display: 'grid',
                    gridTemplateColumns: 'repeat(auto-fill, minmax(125px, 1fr))',
                    gap: '0.75rem',
                    marginTop: '0.85rem',
                  }}>
                    {safeImages.map((image, index) => (
                      <div
                        key={`${image.slice(0, 42)}-${index}`}
                        style={{
                          position: 'relative',
                          overflow: 'hidden',
                          borderRadius: '0.75rem',
                          border: index === 0 ? '2px solid var(--secondary-color)' : '1px solid #dbe4ee',
                          background: '#e2e8f0',
                          boxShadow: '0 2px 8px rgba(15, 23, 42, 0.08)',
                        }}
                      >
                        <img
                          src={image}
                          alt={`已上傳圖片 ${index + 1}`}
                          style={{
                            width: '100%',
                            height: '105px',
                            objectFit: 'cover',
                            display: 'block',
                          }}
                        />
                        {index === 0 && (
                          <span style={{
                            position: 'absolute',
                            top: '0.4rem',
                            left: '0.4rem',
                            padding: '0.2rem 0.45rem',
                            borderRadius: '999px',
                            background: 'rgba(13, 148, 136, 0.92)',
                            color: '#fff',
                            fontSize: '0.68rem',
                            fontWeight: 700,
                          }}>
                            封面
                          </span>
                        )}
                        <div style={{
                          display: 'flex',
                          gap: '0.35rem',
                          padding: '0.45rem',
                          background: '#fff',
                        }}>
                          <button
                            type="button"
                            disabled={index === 0}
                            onClick={() => onSetCover?.(index)}
                            title={index === 0 ? '目前已是封面' : '設為封面'}
                            style={{
                              flex: 1,
                              minWidth: 0,
                              border: '1px solid #cbd5e1',
                              borderRadius: '0.45rem',
                              background: index === 0 ? '#f1f5f9' : '#fff',
                              color: index === 0 ? '#94a3b8' : 'var(--primary-color)',
                              padding: '0.35rem',
                              cursor: index === 0 ? 'default' : 'pointer',
                              display: 'grid',
                              placeItems: 'center',
                            }}
                          >
                            <Star size={14} />
                          </button>
                          <button
                            type="button"
                            onClick={() => onRemove?.(index)}
                            title="刪除此張圖片"
                            style={{
                              flex: 1,
                              minWidth: 0,
                              border: '1px solid rgba(220, 38, 38, 0.3)',
                              borderRadius: '0.45rem',
                              background: 'rgba(254, 242, 242, 0.9)',
                              color: '#dc2626',
                              padding: '0.35rem',
                              cursor: 'pointer',
                              display: 'grid',
                              placeItems: 'center',
                            }}
                          >
                            <Trash2 size={14} />
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            );
          }
          '''

          (ROOT / 'src/components/ImageGallery.jsx').write_text(image_gallery, encoding='utf-8')
          (ROOT / 'src/components/MultiImageUploader.jsx').write_text(multi_uploader, encoding='utf-8')

          admin_path = ROOT / 'src/pages/AdminEditor.jsx'
          admin = admin_path.read_text(encoding='utf-8')

          admin = replace_once(
              admin,
              "import { Save, Download, RotateCcw, AlertTriangle, FileText, Info, Plus, Trash, LogOut, Rocket, Settings, CheckCircle2, XCircle, Loader, Upload, Lock } from 'lucide-react';\n",
              "import { Save, Download, RotateCcw, AlertTriangle, FileText, Info, Plus, Trash, LogOut, Rocket, Settings, CheckCircle2, XCircle, Loader, Upload, Lock } from 'lucide-react';\nimport MultiImageUploader from '../components/MultiImageUploader';\n\nconst MAX_GALLERY_IMAGES = 30;\n\nconst normalizeGalleryItem = (item = {}) => {\n  const images = Array.isArray(item.images)\n    ? item.images.filter((image) => typeof image === 'string' && image.trim())\n    : [];\n  const normalizedImages = images.length > 0 ? images : (item.image ? [item.image] : []);\n  return {\n    ...item,\n    images: normalizedImages,\n    image: normalizedImages[0] || item.image || '',\n  };\n};\n",
              'AdminEditor import',
          )

          admin = replace_once(
              admin,
              "    const normalizedCases = Array.isArray(cloned.home.cases) ? cloned.home.cases : [];\n    while (normalizedCases.length < 4) {\n      normalizedCases.push({ title: '工程實績 ' + (normalizedCases.length + 1), category: '專業清潔維護', description: '請在後台更新此格工程實績說明。', image: '' });\n    }\n    cloned.home.cases = normalizedCases.slice(0, 4);\n    const normalizedCore = Array.isArray(cloned.home.coreProjects) ? cloned.home.coreProjects : [];\n    while (normalizedCore.length < 4) normalizedCore.push(JSON.parse(JSON.stringify(cloned.home.cases[normalizedCore.length])));\n    cloned.home.coreProjects = normalizedCore.slice(0, 4);\n    delete cloned.home.testimonials;\n",
              "    const normalizedCases = (Array.isArray(cloned.home.cases) ? cloned.home.cases : []).map(normalizeGalleryItem);\n    while (normalizedCases.length < 4) {\n      normalizedCases.push(normalizeGalleryItem({ title: '工程實績 ' + (normalizedCases.length + 1), category: '專業清潔維護', description: '請在後台更新此格工程實績說明。', image: '' }));\n    }\n    cloned.home.cases = normalizedCases;\n    const normalizedCore = (Array.isArray(cloned.home.coreProjects) ? cloned.home.coreProjects : []).map(normalizeGalleryItem);\n    while (normalizedCore.length < 4) normalizedCore.push(normalizeGalleryItem(JSON.parse(JSON.stringify(cloned.home.cases[normalizedCore.length]))));\n    cloned.home.coreProjects = normalizedCore.slice(0, 4);\n    cloned.process ||= {};\n    cloned.process.steps = (Array.isArray(cloned.process.steps) ? cloned.process.steps : []).map(normalizeGalleryItem);\n    delete cloned.home.testimonials;\n",
              'AdminEditor normalization',
          )

          upload_anchor = "  const handleSave = () => {\n"
          gallery_helpers = r'''  const compressGalleryImage = (file) => new Promise((resolve, reject) => {
            if (!file || !file.type || !file.type.startsWith('image/')) {
              reject(new Error('檔案不是支援的圖片格式'));
              return;
            }
            if (file.size > 20 * 1024 * 1024) {
              reject(new Error(`${file.name} 超過單張 20MB 上限`));
              return;
            }

            const reader = new FileReader();
            reader.onerror = () => reject(new Error(`${file.name} 讀取失敗`));
            reader.onload = (event) => {
              const img = new Image();
              img.onerror = () => reject(new Error(`${file.name} 無法解析，請改用 JPG、PNG 或 WebP`));
              img.onload = () => {
                try {
                  const maxDimension = 1200;
                  let width = img.width;
                  let height = img.height;

                  if (width > maxDimension || height > maxDimension) {
                    const scale = Math.min(maxDimension / width, maxDimension / height);
                    width = Math.max(1, Math.round(width * scale));
                    height = Math.max(1, Math.round(height * scale));
                  }

                  const canvas = document.createElement('canvas');
                  canvas.width = width;
                  canvas.height = height;
                  const context = canvas.getContext('2d');
                  if (!context) throw new Error('瀏覽器無法建立圖片壓縮畫布');

                  context.imageSmoothingEnabled = true;
                  context.imageSmoothingQuality = 'high';
                  context.fillStyle = '#ffffff';
                  context.fillRect(0, 0, width, height);
                  context.drawImage(img, 0, 0, width, height);

                  let dataUrl = canvas.toDataURL('image/webp', 0.74);
                  if (!dataUrl.startsWith('data:image/webp')) {
                    dataUrl = canvas.toDataURL('image/jpeg', 0.78);
                  }
                  resolve(dataUrl);
                } catch (error) {
                  reject(error);
                }
              };
              img.src = event.target.result;
            };
            reader.readAsDataURL(file);
          });

          const handleGalleryImagesUpload = async (itemPath, fileList) => {
            const files = Array.from(fileList || []).filter((file) => file.type?.startsWith('image/'));
            if (files.length === 0) {
              showToast('請選擇 JPG、PNG、WebP 等圖片檔案。');
              return;
            }

            const currentItem = itemPath.reduce((value, key) => value?.[key], localData) || {};
            const currentImages = Array.isArray(currentItem.images) && currentItem.images.length > 0
              ? currentItem.images.filter(Boolean)
              : (currentItem.image ? [currentItem.image] : []);
            const availableSlots = Math.max(0, MAX_GALLERY_IMAGES - currentImages.length);
            const filesToProcess = files.slice(0, availableSlots);

            if (filesToProcess.length === 0) {
              showToast(`此項目最多可放 ${MAX_GALLERY_IMAGES} 張圖片。`);
              return;
            }

            showToast(`正在壓縮並處理 ${filesToProcess.length} 張圖片，請稍候…`);
            const compressedImages = [];
            let failedCount = 0;

            for (const file of filesToProcess) {
              try {
                compressedImages.push(await compressGalleryImage(file));
              } catch (error) {
                console.error('Gallery image compression failed:', error);
                failedCount += 1;
              }
            }

            if (compressedImages.length === 0) {
              showToast('圖片處理失敗，請改用 JPG、PNG 或 WebP 後重試。');
              return;
            }

            setLocalData((previous) => {
              const nextData = JSON.parse(JSON.stringify(previous));
              let parent = nextData;
              for (let index = 0; index < itemPath.length - 1; index += 1) {
                parent = parent[itemPath[index]];
              }
              const itemKey = itemPath[itemPath.length - 1];
              const item = { ...(parent[itemKey] || {}) };
              const existingImages = Array.isArray(item.images) && item.images.length > 0
                ? item.images.filter(Boolean)
                : (item.image ? [item.image] : []);
              const nextImages = [...existingImages, ...compressedImages].slice(0, MAX_GALLERY_IMAGES);
              parent[itemKey] = {
                ...item,
                images: nextImages,
                image: nextImages[0] || '',
              };
              return nextData;
            });

            const skippedCount = Math.max(0, files.length - filesToProcess.length);
            const notes = [
              `已新增 ${compressedImages.length} 張圖片`,
              failedCount > 0 ? `${failedCount} 張處理失敗` : '',
              skippedCount > 0 ? `${skippedCount} 張因超過上限未加入` : '',
            ].filter(Boolean);
            showToast(`${notes.join('，')}。第一張會作為封面。`);
          };

          const handleRemoveGalleryImage = (itemPath, imageIndex) => {
            setLocalData((previous) => {
              const nextData = JSON.parse(JSON.stringify(previous));
              let parent = nextData;
              for (let index = 0; index < itemPath.length - 1; index += 1) {
                parent = parent[itemPath[index]];
              }
              const itemKey = itemPath[itemPath.length - 1];
              const item = { ...(parent[itemKey] || {}) };
              const existingImages = Array.isArray(item.images) && item.images.length > 0
                ? item.images.filter(Boolean)
                : (item.image ? [item.image] : []);
              const nextImages = existingImages.filter((_, index) => index !== imageIndex);
              parent[itemKey] = {
                ...item,
                images: nextImages,
                image: nextImages[0] || '',
              };
              return nextData;
            });
            showToast('已移除此張圖片。');
          };

          const handleSetGalleryCover = (itemPath, imageIndex) => {
            if (imageIndex === 0) return;
            setLocalData((previous) => {
              const nextData = JSON.parse(JSON.stringify(previous));
              let parent = nextData;
              for (let index = 0; index < itemPath.length - 1; index += 1) {
