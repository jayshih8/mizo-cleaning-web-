name: Apply homepage four-grid v2

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/apply-home-four-grid-v2.mjs'
      - '.github/workflows/apply-home-four-grid-v2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source migration
        run: node scripts/apply-home-four-grid-v2.mjs

      - name: Remove one-time migration files
        run: |
          rm -f scripts/apply-home-four-grid-v2.mjs
          rm -f scripts/apply-home-four-grid-update.mjs
          rm -f .github/workflows/apply-home-four-grid-v2.yml
          rm -f .github/workflows/apply-home-four-grid-update.yml

      - name: Commit updated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: homepage four-grid layout and remove testimonials"
          git push origin main
