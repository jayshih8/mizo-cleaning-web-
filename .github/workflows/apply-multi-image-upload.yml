}

.core-project-caption h4 {
  margin: 0.2rem 0 0;
  color: #fff;
  font-size: 1rem;
  line-height: 1.35;
}

.admin-gallery-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
  gap: 0.75rem;
  margin-top: 1rem;
}

.admin-gallery-item {
  position: relative;
  aspect-ratio: 4 / 3;
  border-radius: var(--radius-sm);
  overflow: hidden;
  background: #e2e8f0;
  border: 1px solid #cbd5e1;
}

.admin-gallery-item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.admin-gallery-remove {
  position: absolute;
  top: 0.4rem;
  right: 0.4rem;
  width: 30px;
  height: 30px;
  border: 0;
  border-radius: 999px;
  background: rgba(15, 23, 42, 0.78);
  color: #fff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

.admin-gallery-remove:hover {
  background: #dc2626;
}

.admin-gallery-index {
  position: absolute;
  left: 0.4rem;
  bottom: 0.4rem;
  min-width: 24px;
  height: 24px;
  padding: 0 0.35rem;
  border-radius: 999px;
  background: rgba(15, 23, 42, 0.72);
  color: #fff;
  font-size: 0.75rem;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.process-step-gallery {
  flex: 1.2;
  min-width: 0;
  min-height: 320px;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 3px;
  padding: 3px;
  background: #e2e8f0;
  overflow: hidden;
}

.process-step-gallery.is-single {
  grid-template-columns: 1fr;
  padding: 0;
}

.process-step-gallery img {
  width: 100%;
  height: 100%;
  min-height: 150px;
  aspect-ratio: 4 / 3;
  object-fit: cover;
  display: block;
  transition: var(--transition-smooth);
}

.process-step-gallery.is-single img {
  min-height: 320px;
  aspect-ratio: auto;
}

.process-step-card:hover .process-step-gallery img {
  transform: scale(1.02);
}

@media (max-width: 992px) {
  .process-step-gallery {
    width: 100%;
    min-height: 260px;
  }
  .process-step-gallery.is-single img {
    min-height: 260px;
  }
}

@media (max-width: 560px) {
  .core-project-gallery {
    grid-template-columns: 1fr;
  }
  .process-step-gallery {
    grid-template-columns: 1fr;
  }
  .admin-gallery-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}
