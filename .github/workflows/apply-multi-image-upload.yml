name: Apply multi-image upload update

on:
  push:
    branches:
      - feat/multi-image-upload-20260826
    paths:
      - '.github/workflows/apply-multi-image-upload.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/multi-image-upload-20260826
          fetch-depth: 0

      - name: Apply source updates
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_between(text, start_marker, end_marker, replacement, label):
              start = text.find(start_marker)
              if start == -1:
                  raise RuntimeError(f'{label}: start marker not found')
              end = text.find(end_marker, start)
              if end == -1:
                  raise RuntimeError(f'{label}: end marker not found')
              return text[:start] + replacement + text[end:]

          admin_path = Path('src/pages/AdminEditor.jsx')
          admin = admin_path.read_text(encoding='utf-8')

          old_init = """    cloned.home ||= {};
    const normalizedCases = Array.isArray(cloned.home.cases) ? cloned.home.cases : [];
    while (normalizedCases.length < 4) {
      normalizedCases.push({ title: '工程實績 ' + (normalizedCases.length + 1), category: '專業清潔維護', description: '請在後台更新此格工程實績說明。', image: '' });
    }
    cloned.home.cases = normalizedCases.slice(0, 4);
    const normalizedCore = Array.isArray(cloned.home.coreProjects) ? cloned.home.coreProjects : [];
    while (normalizedCore.length < 4) normalizedCore.push(JSON.parse(JSON.stringify(cloned.home.cases[normalizedCore.length])));
    cloned.home.coreProjects = normalizedCore.slice(0, 4);
    delete cloned.home.testimonials;
"""
          new_init = """    cloned.home ||= {};
    cloned.process ||= {};
    const normalizedCases = Array.isArray(cloned.home.cases) ? cloned.home.cases : [];
    while (normalizedCases.length < 4) {
      normalizedCases.push({ title: '工程實績 ' + (normalizedCases.length + 1), category: '專業清潔維護', description: '請在後台更新此格工程實績說明。', image: '' });
    }
    cloned.home.cases = normalizedCases;
    const normalizedCore = Array.isArray(cloned.home.coreProjects) ? cloned.home.coreProjects : [];
    while (normalizedCore.length < 4) normalizedCore.push(JSON.parse(JSON.stringify(cloned.home.cases[normalizedCore.length])));
    cloned.home.coreProjects = normalizedCore;
    const normalizedSteps = Array.isArray(cloned.process.steps) ? cloned.process.steps : [];
    cloned.process.steps = normalizedSteps.map((step) => {
      const images = Array.isArray(step.images) ? step.images.filter(Boolean) : [];
      if (step.image && !images.includes(step.image)) images.unshift(step.image);
      return { ...step, image: images[0] || step.image || '', images };
    });
    delete cloned.home.testimonials;
"""
          if old_init not in admin:
              raise RuntimeError('Admin initialization block not found')
          admin = admin.replace(old_init, new_init, 1)

          upload_helpers = r"""  // Image upload helpers: compress single images and batch galleries in-browser.
  const MAX_BATCH_IMAGES = 30;

  const compressImage = (file, fieldPath = []) => new Promise((resolve, reject) => {
    if (!file || !file.type?.startsWith('image/')) {
      reject(new Error('只支援圖片檔案'));
      return;
    }

    const reader = new FileReader();
    reader.onload = (event) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        let width = img.width;
        let height = img.height;
        const isLogo = fieldPath.includes('logoImage');
        const isFavicon = fieldPath.includes('favicon');
        const isGallery = fieldPath.includes('coreProjects') || fieldPath.includes('images');
        let maxDim = isGallery ? 1100 : 1200;

        if (isLogo) maxDim = 400;
        if (isFavicon) maxDim = 128;

        if (width > maxDim || height > maxDim) {
          if (width > height) {
            height = Math.round((height * maxDim) / width);
            width = maxDim;
          } else {
            width = Math.round((width * maxDim) / height);
            height = maxDim;
          }
        }

        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);

        const mimeType = isLogo || isFavicon ? 'image/png' : 'image/jpeg';
        const quality = isGallery ? 0.78 : 0.85;
        resolve(canvas.toDataURL(mimeType, quality));
      };
      img.onerror = () => reject(new Error(`無法讀取圖片：${file.name}`));
      img.src = event.target.result;
    };
    reader.onerror = () => reject(new Error(`無法讀取檔案：${file.name}`));
    reader.readAsDataURL(file);
  });

  const handleImageUpload = async (fieldPath, file) => {
    if (!file) return;
    try {
      const compressedBase64 = await compressImage(file, fieldPath);
      setLocalData((prev) => {
        const newData = JSON.parse(JSON.stringify(prev));
        let current = newData;
        for (let i = 0; i < fieldPath.length - 1; i += 1) current = current[fieldPath[i]];
        current[fieldPath[fieldPath.length - 1]] = compressedBase64;
        return newData;
      });
      showToast('圖片上傳並自動壓縮成功！');
    } catch (error) {
      showToast(`圖片處理失敗：${error.message}`);
    }
  };

  const handleCoreProjectsBatchUpload = async (fileList) => {
    const files = Array.from(fileList || []).filter((file) => file.type?.startsWith('image/'));
    if (!files.length) return;
    const selectedFiles = files.slice(0, MAX_BATCH_IMAGES);
    showToast(`正在處理 ${selectedFiles.length} 張工程實績圖片…`);

    try {
      const uploaded = [];
      for (const file of selectedFiles) {
        uploaded.push({
          image: await compressImage(file, ['home', 'coreProjects']),
          fileName: file.name,
        });
      }

      setLocalData((prev) => {
        const next = JSON.parse(JSON.stringify(prev));
        const projects = Array.isArray(next.home.coreProjects) ? next.home.coreProjects : [];
        let uploadIndex = 0;

        for (let index = 0; index < projects.length && uploadIndex < uploaded.length; index += 1) {
          if (!projects[index].image) {
            projects[index] = { ...projects[index], image: uploaded[uploadIndex].image };
            uploadIndex += 1;
          }
        }

        while (uploadIndex < uploaded.length) {
          const current = uploaded[uploadIndex];
          const titleFromFile = current.fileName.replace(/\.[^.]+$/, '').trim();
          projects.push({
            title: titleFromFile || `工程實績 ${projects.length + 1}`,
            category: '專業清潔維護',
            description: '請在後台補充此工程實績的施工內容與成果說明。',
            image: current.image,
          });
          uploadIndex += 1;
        }

        next.home.coreProjects = projects;
        return next;
      });

      const cappedMessage = files.length > MAX_BATCH_IMAGES ? `（單次最多處理 ${MAX_BATCH_IMAGES} 張）` : '';
      showToast(`已一次加入 ${selectedFiles.length} 張工程實績圖片${cappedMessage}`);
    } catch (error) {
      showToast(`批次圖片處理失敗：${error.message}`);
    }
  };

  const handleDeleteCoreProject = (index) => {
    if (!window.confirm('確定要刪除此張核心工程實績圖片與資料嗎？')) return;
    setLocalData((prev) => ({
      ...prev,
      home: {
        ...prev.home,
        coreProjects: (prev.home.coreProjects || []).filter((_, itemIndex) => itemIndex !== index),
      },
    }));
    showToast('已刪除核心工程實績圖片！');
  };

  const handleStepImagesUpload = async (stepIndex, fileList) => {
    const files = Array.from(fileList || []).filter((file) => file.type?.startsWith('image/'));
    if (!files.length) return;
    const selectedFiles = files.slice(0, MAX_BATCH_IMAGES);
    showToast(`正在處理 ${selectedFiles.length} 張施工照片…`);

    try {
      const uploaded = [];
      for (const file of selectedFiles) uploaded.push(await compressImage(file, ['process', 'steps', stepIndex, 'images']));

      setLocalData((prev) => {
        const next = JSON.parse(JSON.stringify(prev));
        const step = next.process.steps[stepIndex];
        const existing = Array.isArray(step.images) && step.images.length
          ? step.images.filter(Boolean)
          : (step.image ? [step.image] : []);
        const images = [...existing, ...uploaded];
        step.images = images;
        step.image = images[0] || '';
        return next;
      });

      const cappedMessage = files.length > MAX_BATCH_IMAGES ? `（單次最多處理 ${MAX_BATCH_IMAGES} 張）` : '';
      showToast(`已加入 ${selectedFiles.length} 張施工現場照片${cappedMessage}`);
    } catch (error) {
      showToast(`批次圖片處理失敗：${error.message}`);
    }
  };

  const handleRemoveStepImage = (stepIndex, imageIndex) => {
    setLocalData((prev) => {
      const next = JSON.parse(JSON.stringify(prev));
      const step = next.process.steps[stepIndex];
      const existing = Array.isArray(step.images) && step.images.length
        ? step.images.filter(Boolean)
        : (step.image ? [step.image] : []);
      const images = existing.filter((_, index) => index !== imageIndex);
      step.images = images;
      step.image = images[0] || '';
      return next;
    });
    showToast('已移除這張施工照片！');
  };
"""
