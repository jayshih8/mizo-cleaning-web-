const getStepImages = (step) => {
  const images = Array.isArray(step.images) ? step.images.filter(Boolean) : [];
  if (!images.length && step.image) images.push(step.image);
  return images.length ? images : ['images/banner_building.png'];
};

export default function Process({ processData }) {
  if (!processData) return null;

  return (
    <div className="section-padding animate-fade-in">
